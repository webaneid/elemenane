name: Release Theme

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Validate & Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # semantic-release stores release info in git notes; fetch them so pushing the notes is a fast-forward
      # (otherwise the run fails after tagging with "remote rejected refs/notes/semantic-release").
      - name: Fetch semantic-release notes
        run: git fetch origin 'refs/notes/*:refs/notes/*' || true

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Quality & Security Gate before release
        run: |
          composer lint:syntax
          composer analyse
          composer security:scan
          composer css:check
          composer dist:check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dart Sass & Compile SCSS
        run: |
          npm install -g sass
          for f in scss/[!_]*.scss; do
            name=$(basename "$f" .scss)
            sass "$f" "css/${name}.css"
            sass --style=compressed --no-source-map "$f" "css/${name}.min.css"
          done

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes -p semantic-release@22 \
            -p @semantic-release/commit-analyzer@11 \
            -p @semantic-release/release-notes-generator@12 \
            -p @semantic-release/changelog@6 \
            -p @semantic-release/exec@6 \
            -p @semantic-release/git@10 \
            -p @semantic-release/github@9 \
            semantic-release
