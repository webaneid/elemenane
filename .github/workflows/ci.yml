name: CI — Quality & Security Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: PHP Syntax, PHPCS, PHPStan, Security & Dist Gate (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHP syntax check
        run: composer lint:syntax

      - name: Run PHPCS (WordPress Coding Standards & Security)
        if: matrix.php == '8.2'
        run: composer lint:phpcs

      - name: Run PHPStan static analysis
        if: matrix.php == '8.2'
        run: composer analyse

      - name: Run Security & Anti-Backdoor Scan
        if: matrix.php == '8.2'
        run: composer security:scan

      - name: Run SCSS & CSS integrity audit
        if: matrix.php == '8.2'
        run: composer css:check

      - name: Verify production distribution package (.distignore)
        if: matrix.php == '8.2'
        run: composer dist:check
